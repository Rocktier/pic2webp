[package]
name = "pic2webp"
version = "1.6.7"
description = "图片转 WebP 工具 - Tauri 跨平台版"
authors = ["danglei"]
edition = "2024"

[lib]
name = "pic2webp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pic2webp"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
walkdir = "2"
which = "7"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
image = { version = "=0.25.5", default-features = false, features = ["jpeg", "png", "webp", "avif", "gif", "bmp", "tiff"] }
webp = "0.3"
base64 = "0.22"
ab_glyph = "0.2"
notify = "7"
