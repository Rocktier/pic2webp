[package]
name = "pic2webp"
version = "1.9.5"
description = "图片转 WebP 工具 - Rocktier 出品"
authors = ["Rocktier <hello@rocktier.com>"]
edition = "2024"

[lib]
name = "pic2webp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pic2webp"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# license.rs 的回执解析/序列化（FAMILY-LICENSE.md §2）
serde_json = "1"
walkdir = "2"
which = "7"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
image = { version = "=0.25.5", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
webp = "0.3"
base64 = "0.22"
fs2 = "0.4"
# 授权回执的 Ed25519 离线验签（license.rs，FAMILY-LICENSE.md §2）
ed25519-dalek = "2"
