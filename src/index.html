<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="./styles/tokens.css" />

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rocktier Pic2WebP</title>
  <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="stylesheet" href="./fonts.css" />
  <script>
    // 主题必须在第一帧样式解析前定好：三态默认值是 auto（跟随系统），
    // 等 app.js 跑就会先画一帧深色底再跳变。
    (function () {
      try {
        var saved = localStorage.getItem("rocktier.theme");
        var mode = saved === "light" || saved === "dark" ? saved : "auto";
        document.documentElement.setAttribute("data-theme",
          mode === "auto"
            ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
            : mode);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <style>
/* 字体声明已移至 ./fonts.css（内联写法依赖 Vite 的 html-proxy 重写，换构建方式会静默丢字体） */


/* ═══════════ ROCKTIER UI · Pic2WebP ═══════════
   Nothing OS 黑白极简几何 · 玻璃拟态 · 点阵纹理
   主题约定（兼容既有 app.js）：无 data-theme = 深色，data-theme="light" = 浅色 */
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-primary: #000000;
  --bg-secondary: #0a0a0a;
  --bg-card: rgba(255,255,255,0.03);
  --bg-card-hover: rgba(255,255,255,0.06);
  --text-primary: rgba(255,255,255,0.95);
  --text-secondary: rgba(255,255,255,0.72);
  --text-tertiary: rgba(255,255,255,0.58);
  --accent: #ffffff;
  --on-accent: #000000;
  --accent-glow: rgba(255,255,255,0.15);
  --red: #ff4a3d;
  --dot: rgba(255,255,255,0.55);
  --scrollbar: rgba(255,255,255,0.1);
  --scrollbar-hover: rgba(255,255,255,0.2);
  --selection: rgba(255,255,255,0.15);
  /* 结构性令牌（圆角/字体）是主题无关的，必须住在 :root。
     之前只写在 light 块里：默认深色主题下 26 处 var() 全部失效，
     圆角退化为 0、font 简写整条失效（13px/1.55 一起丢）。 */
  --radius-sm: 12px;
  --radius-md: 20px;
  --radius-lg: 28px;
  --radius-pill: 999px;
  --font: "Geist", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
    Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Helvetica,
    Arial, sans-serif;
  --font-mono: "Geist Mono", "SF Mono", "JetBrains Mono", "Fira Code", ui-monospace, monospace;
}

[data-theme="light"] {
  --bg-primary: #ffffff;
  --bg-secondary: #f5f5f5;
  --bg-card: rgba(0,0,0,0.03);
  --bg-card-hover: rgba(0,0,0,0.06);
  --border: rgba(0,0,0,0.08);
  --text-primary: rgba(0,0,0,0.92);
  --text-secondary: rgba(0,0,0,0.64);
  --text-tertiary: rgba(0,0,0,0.60);
  --accent: #000000;
  --on-accent: #ffffff;
  --accent-glow: rgba(0,0,0,0.12);
  --red: #e64537;
  --dot: rgba(0,0,0,0.55);
  --scrollbar: rgba(0, 0, 0, 0.15);
  --scrollbar-hover: rgba(0,0,0,0.25);
  --selection: rgba(0,0,0,0.12);
}

/* 统一主题过渡 + 尊重系统减弱动态 */
*, *::before, *::after {
  transition: background-color .3s ease, border-color .3s ease,
              color .3s ease, box-shadow .3s ease,
              transform .2s cubic-bezier(.25,.1,.25,1);
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

html, body {
  height: 100%;
  font: 13px/1.55 var(--font);
  background: var(--bg-primary);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  user-select: none;
  overflow: hidden;
}
::selection { background: var(--selection); }

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* ───────── Header ───────── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 20px;
  background: var(--bg-card);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  -webkit-app-region: drag;
  flex-shrink: 0;
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-text h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.02em; }

/* 字母标记 —— 与应用图标同款方块：两种主题下都保持深色，确保和 Dock 图标一致；
   细描边避免在深色标题栏上糊成一团 */
.brand-mark { width: 26px; height: 26px; flex-shrink: 0; }
.brand-mark .brand-tile { fill: #0a0a0a; stroke: var(--border-hover); stroke-width: 1; }
.brand-mark .brand-letters { fill: #ffffff; font-family: var(--font); }
.brand-mark .brand-pip { fill: var(--red); }
.brand-mark .brand-badge { fill: #ffffff; }
/* 家族红点（2026-10-05）：品牌名右侧呼吸红点，与官网字标句点同位。
   本文件样式为私有方言（家族 tokens.css 未引入），dotpulse 在此自带一份。 */
.dot-live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-left:8px;vertical-align:middle;animation:dotpulse 3s var(--ease) infinite}
@keyframes dotpulse{0%,100%{opacity:1}50%{opacity:.4}}
.subtitle { font-size: 11px; color: var(--text-tertiary); font-weight: 500; }

.header-controls {
  display: flex; align-items: center; gap: 6px;
  -webkit-app-region: no-drag;
}

/* ───────── Main Layout（双栏） ───────── */
.main-layout { display: flex; flex: 1; overflow: hidden; }
.left-panel {
  flex: 1; display: flex; flex-direction: column;
  padding: 16px 20px; min-width: 0;
  background: var(--bg-primary);
  gap: 8px;
}
.right-panel {
  width: clamp(220px, 25vw, 280px); display: flex; flex-direction: column;
  justify-content: flex-start; gap: 4px;
  padding: 8px 12px;
  overflow-y: auto; overflow-x: hidden; /* 兜底可滚但不显示滚动条 */
  background: var(--bg-secondary);
  border-left: 1px solid var(--border);
  flex-shrink: 0;
}

/* ───────── 拖放区（点阵纹理 + 玻璃） ───────── */
.dropzone {
  position: relative;
  border: 1.5px dashed var(--border-hover);
  border-radius: var(--radius-lg);
  padding: 18px 20px; text-align: center; cursor: pointer;
  background: var(--bg-card);
  overflow: hidden;
  flex-shrink: 0;
}
.dropzone::before {
  content: "";
  position: absolute; inset: 0;
  background-image: radial-gradient(var(--dot) 1px, transparent 1.6px);
  background-size: 22px 22px;
  -webkit-mask-image: radial-gradient(70% 70% at 50% 45%, #000 30%, transparent 78%);
          mask-image: radial-gradient(70% 70% at 50% 45%, #000 30%, transparent 78%);
  opacity: 0.18;
  pointer-events: none;
}
.dropzone-content { position: relative; z-index: 1; }
.dropzone:hover, .dropzone.dragover {
  border-color: var(--accent);
  background: var(--bg-card-hover);
}
.dropzone:hover { transform: translateY(-1px); }
.dropzone.dragover { transform: scale(1.01); }
.dropzone-icon { margin-bottom: 4px; color: var(--text-secondary); }
.dropzone:hover .dropzone-icon,
.dropzone.dragover .dropzone-icon {
  color: var(--accent);
  filter: drop-shadow(0 0 12px var(--accent-glow));
}
.dropzone-text { font-size: 13px; font-weight: 600; color: var(--text-primary); letter-spacing: -0.01em; }
.dropzone-hint { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }

/* 空态 dropzone 视觉强调 */
@keyframes borderBreath {
  0%, 100% { border-color: var(--border); }
  50% { border-color: var(--border-hover); }
}
@media (prefers-reduced-motion: no-preference) {
  .dropzone.empty {
    flex: 1;
    min-height: 260px;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 28px;
    animation: borderBreath 3s ease-in-out infinite;
  }
  .dropzone.empty .dropzone-icon svg {
    width: 48px; height: 48px;
  }
  .dropzone.empty .dropzone-icon {
    margin-bottom: 8px;
  }
}

/* ───────── 文件列表 ───────── */
.file-list-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 2px 2px; font-size: 11px;
  color: var(--text-secondary); font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.12em;
}
.file-count-dot {
  display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); margin-right: 8px;
}
.file-list { flex: 1; overflow-y: auto; padding-bottom: 4px; margin: 0 -2px; }

/* 空态：玻璃卡片 */
.empty-state {
  background: var(--bg-card);
  border-radius: var(--radius-sm);
  padding: 14px 20px 16px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border);
}
.empty-state p { font-weight: 600; font-size: 12px; margin-bottom: 4px; letter-spacing: -0.01em; }
.empty-state .info-section { margin-top: 10px; }
.empty-state .info-section:first-child { margin-top: 0; }
.empty-state ul { list-style: none; font-size: 11px; color: var(--text-secondary); line-height: 1.8; }
.empty-state ul li::before {
  content: ""; display: inline-block; width: 4px; height: 4px; border-radius: 50%;
  background: var(--accent); margin-right: 8px; vertical-align: middle; opacity: 0.6;
}
	
/* 空态折叠 */
	
	/* 文件行 */
.file-item {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px;
  background: var(--bg-card);
  border-radius: var(--radius-sm);
  margin-bottom: 4px;
  border: 1px solid var(--border);
  font-size: 12px;
}
.file-item:hover { background: var(--bg-card-hover); border-color: var(--border-hover); transform: translateY(-1px); }
.file-thumb {
  width: 36px; height: 36px; border-radius: 9px; object-fit: cover;
  background: var(--bg-card); flex-shrink: 0; border: 1px solid var(--border);
}
.file-info { flex: 1; min-width: 0; }
.file-name { font-weight: 500; font-family: var(--font-mono); font-size: 11.5px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-primary); }
.file-size { font-size: 11px; color: var(--text-secondary); font-family: var(--font-mono); font-variant-numeric: tabular-nums; margin-top: 2px; }
.file-status {
  flex-shrink: 0; font-size: 11px; padding: 3px 11px; border-radius: var(--radius-pill);
  font-weight: 500; letter-spacing: 0.01em;
  border: 1px solid var(--border);
}
.status-pending { color: var(--text-tertiary); background: transparent; }
.status-compressing { color: var(--accent); background: var(--bg-card); }
.status-converting { color: var(--accent); background: var(--bg-card); }
/* 这两个描边原先写死成**浅色档**的色值字面量（rgba(34,178,77,.35) / rgba(230,69,55,.35)），
   而上面的文字用的是 var(--success) / var(--danger)。于是深色模式下文字是深色档的绿/红，
   描边却还是浅色档的绿/红 —— 边框与文字不同色，肉眼看得出错位。
   改用 color-mix 从令牌派生（家族 toast 已用此法），两个主题自动跟随。 */
.status-done { color: var(--success); background: var(--bg-card); border-color: color-mix(in srgb, var(--success) 35%, transparent); }
.status-skipped { color: var(--text-tertiary); background: transparent; border: 1px dashed var(--border-hover); }
.status-failed { color: var(--danger); background: var(--bg-card); border-color: color-mix(in srgb, var(--danger) 35%, transparent); }

/* ───────── 右侧控制 ───────── */
.panel-section { display: flex; flex-direction: column; gap: 2px; }
.section-label {
  font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.2em; color: var(--text-tertiary);
}
.quality-header { display: flex; align-items: baseline; justify-content: space-between; flex-direction: column; align-items: flex-start; gap: 4px; }
@media (min-width: 800px) {
  .quality-header { flex-direction: row; align-items: baseline; }
}
.quality-label { font-size: 11px; font-weight: 500; color: var(--text-secondary); }
.quality-value { font-weight: 700; color: var(--accent); font-family: var(--font-mono); font-size: 14px; font-variant-numeric: tabular-nums; }

/* Toggle — 规范 36×20，checked 变白，位移 16px */
.toggle-row { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12px; min-height: 20px; }
.toggle-row input { position: absolute; width: 1px; height: 1px; clip-path: inset(50%); opacity: 0; }
.toggle-track {
  width: 36px; height: 20px; background: var(--border-hover); border-radius: var(--radius-pill);
  position: relative; transition: background .25s; flex-shrink: 0;
}
.toggle-row input:checked + .toggle-track { background: var(--accent); }
.toggle-thumb {
  position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
  background: var(--on-accent); border-radius: 50%;
  transition: transform .25s cubic-bezier(.25,.1,.25,1); box-shadow: 0 1px 3px var(--shadow);
}
.toggle-row input:checked + .toggle-track .toggle-thumb { transform: translateX(16px); }
.toggle-row input:focus-visible + .toggle-track { outline: 2px solid var(--accent); outline-offset: 2px; }

/* mini-toggle（复选框）。label 整体即点击区；输入框视觉 16px ——
   2026-10-16 UX 审计实测 12px，与文字标签不成比例。 */
.mini-toggle { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-secondary); cursor: pointer; min-height: 24px; }
.mini-toggle input { accent-color: var(--accent); width: 16px; height: 16px; }

/* Pill 按钮组 */
.pill-group { display: flex; gap: 4px; flex-wrap: wrap; }
.pill-btn {
  flex: 1 1 auto; padding: 4px 8px; min-height: 26px;
  border: 1px solid var(--border); border-radius: var(--radius-md);
  background: var(--bg-card); color: var(--text-secondary);
  font-size: 11px; font-weight: 500; cursor: pointer; text-align: center;
  white-space: nowrap;
  display: inline-flex; align-items: center; justify-content: center;
}
.pill-btn:hover { background: var(--bg-card-hover); border-color: var(--border-hover); color: var(--text-primary); }
.pill-btn.active, .pill-btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

.dir-row { display: flex; gap: 6px; align-items: center; }
.dir-input {
  flex: 1; border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 4px 8px; font-size: 11px; background: var(--bg-card); color: var(--text-secondary);
  font-family: var(--font-mono); cursor: default; min-height: 24px;
}
.divider { border: none; border-top: 1px solid var(--border); margin: 2px 0; opacity: .7; }

/* 质量预设三档 + 命名 2×2：窄幅一屏排布，不出现滑块/滚动条 */
#quality-pills { display: flex; gap: 4px; }
#quality-pills .pill-btn { flex: 1 1 0; min-width: 0; }
#naming-pills { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
#naming-pills .pill-btn { width: 100%; }
.right-panel { scrollbar-width: none; }
.right-panel::-webkit-scrollbar { display: none; }
.hint { font-size: 11px; color: var(--text-tertiary); line-height: 1.5; font-weight: 400; }
.hint.warn {
  color: var(--danger); background: var(--bg-card); padding: 5px 9px;
  border-radius: 8px; border: 1px solid rgba(230,69,55,0.35);
}

/* ───────── 统计面板（玻璃） ───────── */
.stats-panel {
  display: flex; flex-wrap: wrap; align-items: center; gap: 2px 0;
  padding: 8px 12px; border-radius: var(--radius-sm);
  background: var(--bg-card); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border);
}
.stats-row { display: flex; align-items: baseline; gap: 14px; width: 100%; justify-content: center; }
.stats-row-bottom { display: flex; align-items: center; gap: 8px; width: 100%; justify-content: space-between; margin-top: 2px; }
.stats-panel[hidden] { display: none; }
.stats-panel.pulse { animation: statsPulse 1s ease; }
@keyframes statsPulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 var(--success); } 50% { transform: scale(1.02); box-shadow: 0 0 0 6px transparent; } 100% { transform: scale(1); } }
.stat-item { display: flex; align-items: baseline; gap: 4px; }
.stat-num { font-weight: 700; font-family: var(--font-mono); font-size: 12px; color: var(--text-primary); font-variant-numeric: tabular-nums; }
.stat-num.stat-fail { color: var(--danger); }
.stat-lbl { font-size: 10px; color: var(--text-tertiary); font-weight: 500; }
.stat-saved { display: flex; align-items: baseline; gap: 5px; }
.stat-saved-val { font-weight: 700; font-family: var(--font-mono); font-size: 13px; color: var(--success); font-variant-numeric: tabular-nums; }
.stat-saved-lbl { font-size: 10px; color: var(--text-tertiary); font-weight: 500; }

/* ───────── 按钮 ───────── */
button:focus-visible, .pill-btn:focus-visible, .lang-toggle:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
button:disabled { opacity: 0.4; cursor: not-allowed; }

#convert-btn { margin-top: auto; flex-shrink: 0; }
.btn-primary {
  width: 100%; min-width: 140px; padding: 9px;
  border: none; border-radius: var(--radius-md);
  background: var(--accent); color: var(--on-accent);
  font-size: 13px; font-weight: 600; font-family: var(--font); cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  letter-spacing: 0.01em;
  box-shadow: 0 2px 6px var(--shadow);
}
.btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 0 30px var(--accent-glow), 0 8px 24px var(--shadow); }
.btn-primary:active:not(:disabled) { transform: translateY(0); }
.btn-primary:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
.btn-primary.cancel-mode { background: var(--danger); color: #fff; box-shadow: 0 2px 6px rgba(230,69,55,.25); }
.btn-primary.cancel-mode:hover:not(:disabled) { box-shadow: 0 0 30px rgba(230,69,55,.3); }

.btn-secondary {
  padding: 6px 12px; min-height: 28px;
  border: 1px solid var(--border); border-radius: var(--radius-md);
  background: var(--bg-card); font-size: 11px; font-weight: 500; cursor: pointer; color: var(--text-primary);
  display: inline-flex; align-items: center; justify-content: center;
}
.btn-secondary:hover { background: var(--bg-card-hover); border-color: var(--border-hover); }

.btn-text {
  border: none; background: none; color: var(--text-secondary); cursor: pointer;
  font-size: 11px; font-weight: 500; padding: 5px 8px; border-radius: 8px;
  /* 24px 命中区（2026-10-16 UX 审计实测 22px 高） */
  min-height: 24px; box-sizing: border-box;
  display: inline-flex; align-items: center; justify-content: center;
}
.btn-text:hover { color: var(--accent); background: var(--bg-card); }

.retry-all { padding: 2px 8px; font-size: 10px; white-space: nowrap; color: var(--danger); border: 1px solid rgba(230,69,55,0.4); border-radius: var(--radius-pill); background: none; }
.retry-all:hover { background: var(--bg-card-hover); }

.retry-btn { flex-shrink: 0; border: none; background: none; color: var(--text-tertiary); cursor: pointer; font-size: 14px; padding: 2px 7px; border-radius: 8px; }
.retry-btn:hover { color: var(--accent); background: var(--bg-card); }
	
/* 单文件删除 */
.file-delete-btn {
  flex-shrink: 0; border: none; background: none;
  color: var(--text-tertiary); cursor: pointer;
  font-size: 14px; padding: 2px 6px; border-radius: 8px;
  line-height: 1; margin-left: 2px; opacity: 0; transition: opacity .15s;
}
.file-item:hover .file-delete-btn { opacity: 1; }
.file-delete-btn:hover { color: var(--danger); background: var(--bg-card-hover); }
	
	/* ───────── 高级选项 ───────── */
.advanced-section { display: block; margin-top: 4px; }
.advanced-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
.advanced-row label { font-size: 11px; color: var(--text-secondary); white-space: nowrap; }
.advanced-row input[type="number"], .advanced-row input[type="text"], .advanced-row select {
  padding: 4px 6px; font-size: 11px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg-card); color: var(--text-primary); font-family: var(--font-mono);
}
.advanced-row input[type="number"] { width: 62px; }
.advanced-row input[type="text"] { width: 124px; }
.advanced-row select { font-family: var(--font); }

/* ───────── 语言 / 主题 切换 ───────── */
.lang-toggle {
  font-size: 10px; font-weight: 500; padding: 3px 20px 3px 9px; border-radius: var(--radius-pill);
  background: var(--bg-card); border: 1px solid var(--border); color: var(--text-secondary);

  height: 28px;
