name: Checks

# Pic2WebP 此前唯一的 push 工作流是 notify-family-gate：build.yml 只在 tag /
# 手动触发，push 不跑类型检查、单测与 clippy —— 付费墙（license/trial）的
# 改动从未过 Rust 质量门（2026-10-19~20 grill-me 找茬 A1，用户第一性原则
# 拍板修复）。本文件把 MD 仓同配方（纯 Tauri、无 Go engine）的 Tests & Lints
# 作业挂到 push；配方差异仅：前端侧此前只跑 build，没有单测（2026-11-07 补上
# tests/ 与 npm test —— 起因是两个只在前端发生、Rust 侧完全看不见的 bug）。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Tests & Lints
    # macOS, not ubuntu: cargo test/clippy compile the Tauri crate, which on Linux
    # needs glib/gtk/webkit system libraries the bare runner does not have. Here it
    # compiles against the same platform the shipping build uses.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Ensure clippy component
        # dtolnay action 的 components: clippy 在部分 macOS runner 镜像上装不到
        # 活动 toolchain（CAD db7b5fc 曾报 cargo-clippy is not installed for
        # 1.98.0，而同配方的 pic2webp/MD 同一晚却过了 —— 镜像状态差异）。
        # 显式对当前 toolchain 补装，幂等，防复发。
        run: rustup component add clippy
      - name: Install dependencies
        run: npm ci
      - name: Type check + build
        run: npm run build
      - name: Frontend tests
        # tests/ 是纯 node:test，零依赖、不起浏览器：判据盯着「白名单与后端能力一致」
        # 和「结果区收尾有没有接上」这两类 Rust 侧看不见、UI 上才暴露的问题。
        run: npm test
      - name: Rust tests + clippy
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
