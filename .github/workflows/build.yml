name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']

# 同一分支/tag 的新推送会取消旧的构建
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup npm mirror (China)
        run: npm config set registry https://registry.npmmirror.com

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup cargo mirror (China)
        if: matrix.platform == 'windows-latest'
        run: |
          $dir = "$env:USERPROFILE\.cargo"
          New-Item -ItemType Directory -Force $dir | Out-Null
          @"
          [source.crates-io]
          replace-with = "tuna"
          [source.tuna]
          registry = "sparse+https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/"
          "@ | Out-File -FilePath "$dir\config.toml" -Encoding utf8
        shell: pwsh

      - name: Setup cargo mirror (China)
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << 'EOF'
          [source.crates-io]
          replace-with = "tuna"
          [source.tuna]
          registry = "sparse+https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/"
          EOF

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm install

      # ──────────────────────────────────────────────
      #  macOS: 构建 + ad-hoc 签名
      # ──────────────────────────────────────────────
      - name: Build & Sign (macOS)
        if: matrix.platform == 'macos-latest'
        run: bash scripts/build-and-sign.sh

      - name: Prepare release artifact (macOS)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'macos-latest'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp /tmp/pic2webp-signed.dmg "Pic2WebP_${VERSION}_aarch64.dmg"
          APP=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          [ -z "$APP" ] && { echo "::error::.app not found"; exit 1; }
          ditto -c -k --keepParent "$APP" "Rocktier.Pic2WebP.app.zip"

      # ──────────────────────────────────────────────
      #  Windows: 构建
      # ──────────────────────────────────────────────
      - name: Build (Windows)
        if: matrix.platform == 'windows-latest'
        run: npm run tauri build

      # 微软商店包：tauri-windows-bundle 读取 src-tauri/gen/windows/（清单模板 + 自有磁贴）
      - name: Build MSIX for Microsoft Store (Windows)
        if: matrix.platform == 'windows-latest'
        run: npm run tauri:windows:build

      # ──────────────────────────────────────────────
      #  测试构建产物上传 (main 分支)
      # ──────────────────────────────────────────────
      - name: Upload artifact (macOS)
        if: github.ref == 'refs/heads/main' && matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Pic2WebP-macos-aarch64
          path: /tmp/pic2webp-signed.dmg
          if-no-files-found: error

      - name: Upload artifact (Windows)
        if: github.ref == 'refs/heads/main' && matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Pic2WebP-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/msix/*.msix*
          if-no-files-found: error

      # ──────────────────────────────────────────────
      #  GitHub Release (tag 推送时)
      # ──────────────────────────────────────────────
      - name: Release (macOS)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            Pic2WebP_*.dmg
            Rocktier.Pic2WebP.app.zip
          generate_release_notes: true

      - name: Release (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/msix/*.msix*
          generate_release_notes: true

  # 发布闸门：两平台都传完之后，先校验资产清单齐全，再把草稿发布为 latest。
  # 不齐就保留草稿并让 job 失败 —— 用户永远不会拿到残缺包。
  # 仅 tag 推送时运行（main 推送不创建 release，跳过）。
  publish:
    name: Verify & Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REQUIRED_ASSETS: '\.dmg$ \.app\.zip$ \.msi$ \.exe$ \.msix$ \.msixbundle$'
    steps:
      - name: Verify assets then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "Verifying release $TAG"
          for i in $(seq 1 18); do
            assets=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)
            ok=1
            for pat in $REQUIRED_ASSETS; do
              printf '%s\n' "$assets" | grep -Eq "$pat" || ok=0
            done
            [ "$ok" -eq 1 ] && break
            echo "  waiting for uploads ($(printf '%s\n' "$assets" | grep -c . || true) so far)..."
            sleep 10
          done
          missing=0
          for pat in $REQUIRED_ASSETS; do
            if ! printf '%s\n' "$assets" | grep -Eq "$pat"; then
              echo "::error::release $TAG missing asset matching $pat"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::release $TAG is missing required assets — left as DRAFT for manual review"
            exit 1
          fi
          echo "All required assets present; publishing $TAG"
          gh release edit "$TAG" --draft=false --latest
