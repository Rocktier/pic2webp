name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']

# 同一分支/tag 的新推送会取消旧的构建
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup npm mirror (China)
        run: npm config set registry https://registry.npmmirror.com

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup cargo mirror (China)
        if: matrix.platform == 'windows-latest'
        run: |
          $dir = "$env:USERPROFILE\.cargo"
          New-Item -ItemType Directory -Force $dir | Out-Null
          @"
          [source.crates-io]
          replace-with = "tuna"
          [source.tuna]
          registry = "sparse+https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/"
          "@ | Out-File -FilePath "$dir\config.toml" -Encoding utf8
        shell: pwsh

      - name: Setup cargo mirror (China)
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << 'EOF'
          [source.crates-io]
          replace-with = "tuna"
          [source.tuna]
          registry = "sparse+https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/"
          EOF

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm install

      # ──────────────────────────────────────────────
      #  macOS: 构建 + ad-hoc 签名
      # ──────────────────────────────────────────────
      - name: Build & Sign (macOS)
        if: matrix.platform == 'macos-latest'
        run: bash scripts/build-and-sign.sh

      - name: Prepare release artifact (macOS)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'macos-latest'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp /tmp/pic2webp-signed.dmg "Pic2WebP_${VERSION}_aarch64.dmg"
          APP=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          [ -z "$APP" ] && { echo "::error::.app not found"; exit 1; }
          ditto -c -k --keepParent "$APP" "Rocktier.Pic2WebP.app.zip"

      # ──────────────────────────────────────────────
      #  Windows: 构建
      # ──────────────────────────────────────────────
      - name: Build (Windows)
        if: matrix.platform == 'windows-latest'
        run: npm run tauri build

      # 微软商店包：tauri-windows-bundle 读取 src-tauri/gen/windows/（清单模板 + 自有磁贴）
      - name: Build MSIX for Microsoft Store (Windows)
        if: matrix.platform == 'windows-latest'
        # MSIX 直装走 direct 付费墙（微软商店渠道已弃用，2026-10-05 终裁 C3）。
        # 若未来恢复商店渠道：本步需加 env ROCKTIER_CHANNEL: store（10.8.2/10.8.4）。
        run: npm run tauri:windows:build

      # ──────────────────────────────────────────────
      #  测试构建产物上传 (main 分支)
      # ──────────────────────────────────────────────
      - name: Upload artifact (macOS)
        if: github.ref == 'refs/heads/main' && matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Pic2WebP-macos-aarch64
          path: /tmp/pic2webp-signed.dmg
          if-no-files-found: error

      - name: Upload artifact (Windows)
        if: github.ref == 'refs/heads/main' && matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Pic2WebP-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/msix/*.msix*
          if-no-files-found: error

      # ──────────────────────────────────────────────
      #  GitHub Release (tag 推送时)
      # ──────────────────────────────────────────────
      - name: Release (macOS)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            Pic2WebP_*.dmg
            Rocktier.Pic2WebP.app.zip
          generate_release_notes: true

      # 只在 Windows 上跑。本仓的 build job 是 matrix（macos + windows 合一），
      # 而 MSI 是 Windows 安装包格式 —— macOS 上永远不存在 *.msi，
      # 守卫（found=0 即 exit 1）会在 macOS job 里必然触发，把整个构建拖红。
      # 其余 8 仓都是 build-windows 独立 job，不受这个问题影响。
      - name: Strip _en-US from MSI filename
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          shopt -s nullglob
          found=0
          for f in src-tauri/target/release/bundle/msi/*_en-US.msi; do
            nf="${f%_en-US.msi}.msi"
            mv "$f" "$nf"
            echo "  $(basename "$f") -> $(basename "$nf")"
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no *_en-US.msi found - Tauri naming changed, this step needs updating"
            ls -1 src-tauri/target/release/bundle/msi/ 2>/dev/null || true
            exit 1
          fi

      - name: Release (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/msix/*.msix*
          generate_release_notes: true

  # 发布闸门：两平台都传完之后，先校验资产清单齐全，再把草稿发布为 latest。
  # 不齐就保留草稿并让 job 失败 —— 用户永远不会拿到残缺包。
  # 仅 tag 推送时运行（main 推送不创建 release，跳过）。
  publish:
    name: Verify & Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REQUIRED_ASSETS: '\.dmg$ \.app\.zip$ \.msi$ \.exe$ \.msix$ \.msixbundle$'
    steps:
# 这个 job **必须 checkout**，否则下面的 gh 命令无法工作。
      # 没有 actions/checkout 就没有 git remote，而 gh 靠 git remote 推断
      # 当前仓库 —— 于是每条 gh 命令报
      #   `failed to run git: fatal: not a git repository`
      # 并以非 0 退出。
      #
      # 本 job 只需要读/改 Release 状态、不需要源码，但**为了让 gh 认出
      # 仓库，仍必须 checkout**（build job 都有，只有这里漏了）。
      #
      # 实测踩过：MD / CAD / Journal / Pic2WebP / Sign 五仓发版全红，
      # 报错是「六个包全缺」，而 draft 里资产其实早已上传齐全
      # （本仓 v1.9.7 实测 draft 内 6/6 齐全）—— 真因是这里缺 checkout，
      # 此前被校验段里的 `2>/dev/null || true` 掩盖着；去掉那个
      # `2>/dev/null` 之后它才浮出来。
      #
      # 另一条思路是给每条 gh 命令加 `--repo ${{ github.repository }}`。
      # 选checkout 是因为它一次解决全部 gh 子命令（view/edit/upload），
      # 而 `--repo` 漏写一处就又坏。
      - uses: actions/checkout@v4
      - name: Verify assets then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "Verifying release $TAG"
          # Uploads are done (needs: build jobs); GitHub's asset API can lag
          # minutes before a freshly-uploaded file appears in `gh release view`.
          # Poll up to ~10 min with an initial settle delay before giving up.
          sleep 20
          for i in $(seq 1 30); do
            assets=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)
            ok=1
            for pat in $REQUIRED_ASSETS; do
              printf '%s\n' "$assets" | grep -Eq "$pat" || ok=0
            done
            [ "$ok" -eq 1 ] && break
            echo "  waiting for uploads ($(printf '%s\n' "$assets" | grep -c . || true) so far)..."
            sleep 20
          done
          missing=0
          for pat in $REQUIRED_ASSETS; do
            if ! printf '%s\n' "$assets" | grep -Eq "$pat"; then
              echo "::error::release $TAG missing asset matching $pat"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::release $TAG is missing required assets — left as DRAFT for manual review"
            exit 1
          fi
          echo "All required assets present; publishing $TAG"
          gh release edit "$TAG" --draft=false --latest
