name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  # 手动出测试包：特性分支也能产出 artifact，不必先把 main 弄脏。
  # 只上传 artifact，不创建 release（release 仍只认 tag）。
  workflow_dispatch:

# crates.io 直连偶发超时，留重试余量
env:
  CARGO_NET_RETRY: 10

# 同一分支/tag 的新推送会取消旧的构建
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            platform: macos-latest
            arch: aarch64
            filearch: arm64
          - os: macos
            platform: macos-15-intel
            arch: x64
            filearch: x86_64
          - os: windows
            platform: windows-latest

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup npm mirror (China)
        run: npm config set registry https://registry.npmmirror.com

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      - name: Install npm dependencies
        run: npm install

      # ──────────────────────────────────────────────
      #  macOS: 构建 + 签名（有证书则 Developer ID + 公证，否则 ad-hoc）
      # ──────────────────────────────────────────────
      - name: Build & Sign (macOS)
        if: matrix.os == 'macos'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash scripts/build-and-sign.sh

      - name: Stage macOS artifact
        if: matrix.os == 'macos'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          DMG="Pic2WebP_${VERSION}_${{ matrix.arch }}.dmg"
          cp /tmp/pic2webp-signed.dmg "$DMG"

          # 最终 DMG 校验：拷贝来源存在不等于拷贝成功，必须落到暂存件上验
          [ -f "$DMG" ] && [ "$(stat -f%z "$DMG")" -gt 0 ] \
            || { echo "::error::staged DMG missing or zero bytes: $DMG"; exit 1; }
          codesign --verify "$DMG" \
            || { echo "::error::staged DMG signature is invalid"; exit 1; }
          if [ -n "${APPLE_CERT_P12:-}" ]; then
            # case 而非 grep -q：pipefail 下 grep 提前退出会让 codesign 收 SIGPIPE(141)
            info=$(codesign -dv --verbose=4 "$DMG" 2>&1 || true)
            case "$info" in *"Authority=Developer ID Application"*) ;; *)
              echo "::error::staged DMG is missing Developer ID authority"; exit 1 ;; esac
            case "$info" in *"Timestamp="*) ;; *)
              echo "::error::staged DMG signature has no secure timestamp"; exit 1 ;; esac
          else
            echo "::notice::ad-hoc build: DMG authority/timestamp assertions skipped (by design)."
          fi

          APP=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          [ -z "$APP" ] && { echo "::error::.app not found"; exit 1; }
          file "$APP/Contents/MacOS/"* | tee /dev/stderr | grep -q '${{ matrix.filearch }}'

      - name: Package app.zip (macOS)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'macos'
        run: |
          APP=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          [ -z "$APP" ] && { echo "::error::.app not found"; exit 1; }
          ditto -c -k --keepParent "$APP" "Rocktier.Pic2WebP_${{ matrix.arch }}.app.zip"

      # ──────────────────────────────────────────────
      #  Windows: 构建
      # ──────────────────────────────────────────────
      - name: Build (Windows)
        if: matrix.os == 'windows'
        run: npm run tauri build

      # 微软商店包：tauri-windows-bundle 读取 src-tauri/gen/windows/（清单模板 + 自有磁贴）
      - name: Build MSIX for Microsoft Store (Windows)
        if: matrix.os == 'windows'
        # 商店渠道固定 ROCKTIER_CHANNEL=store：不开自研试用拦截（微软 10.8.2 / 10.8.4），
        # Help 菜单也不出「检查更新 / 官方网站」。MSIX 只用于商店提交，直装走 NSIS/MSI。
        env:
          ROCKTIER_CHANNEL: store
        run: npm run tauri:windows:build

      # ──────────────────────────────────────────────
      #  测试构建产物上传 (main 分支)
      # ──────────────────────────────────────────────
      - name: Upload artifact (macOS)
        if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && matrix.os == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: Pic2WebP-macos-${{ matrix.arch }}
          path: Pic2WebP_*_${{ matrix.arch }}.dmg
          if-no-files-found: error

      - name: Upload artifact (Windows)
        if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && matrix.os == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: Pic2WebP-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/msix/*.msix*
          if-no-files-found: error

      # ──────────────────────────────────────────────
      #  GitHub Release (tag 推送时)
      # ──────────────────────────────────────────────
      - name: Release (macOS)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'macos'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            Pic2WebP_*_${{ matrix.arch }}.dmg
            Rocktier.Pic2WebP_${{ matrix.arch }}.app.zip
          generate_release_notes: true

      # 只在 Windows 上跑。本仓的 build job 是 matrix（macos + windows 合一），
      # 而 MSI 是 Windows 安装包格式 —— macOS 上永远不存在 *.msi，
      # 守卫（found=0 即 exit 1）会在 macOS job 里必然触发，把整个构建拖红。
      # 其余 8 仓都是 build-windows 独立 job，不受这个问题影响。
      - name: Strip _en-US from MSI filename
        if: matrix.os == 'windows'
        shell: bash
        run: |
          shopt -s nullglob
          found=0
          for f in src-tauri/target/release/bundle/msi/*_en-US.msi; do
            nf="${f%_en-US.msi}.msi"
            mv "$f" "$nf"
            echo "  $(basename "$f") -> $(basename "$nf")"
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no *_en-US.msi found - Tauri naming changed, this step needs updating"
            ls -1 src-tauri/target/release/bundle/msi/ 2>/dev/null || true
            exit 1
          fi

      - name: Release (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'windows'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/msix/*.msix*
          generate_release_notes: true

  # 发布闸门：两平台都传完之后，先校验资产清单齐全，再把草稿发布为 latest。
  # 不齐就保留草稿并让 job 失败 —— 用户永远不会拿到残缺包。
  # 仅 tag 推送时运行（main 推送不创建 release，跳过）。
  publish:
    name: Verify & Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REQUIRED_ASSETS: '_aarch64\.dmg$ _x64\.dmg$ _aarch64\.app\.zip$ _x64\.app\.zip$ \.msi$ \.exe$ \.msix$ \.msixbundle$'
    steps:
# 这个 job **必须 checkout**，否则下面的 gh 命令无法工作。
      # 没有 actions/checkout 就没有 git remote，而 gh 靠 git remote 推断
      # 当前仓库 —— 于是每条 gh 命令报
      #   `failed to run git: fatal: not a git repository`
      # 并以非 0 退出。
      #
      # 本 job 只需要读/改 Release 状态、不需要源码，但**为了让 gh 认出
      # 仓库，仍必须 checkout**（build job 都有，只有这里漏了）。
      #
      # 实测踩过：MD / CAD / Journal / Pic2WebP / Sign 五仓发版全红，
      # 报错是「六个包全缺」，而 draft 里资产其实早已上传齐全
      # （本仓 v1.9.7 实测 draft 内 6/6 齐全）—— 真因是这里缺 checkout，
      # 此前被校验段里的 `2>/dev/null || true` 掩盖着；去掉那个
      # `2>/dev/null` 之后它才浮出来。
      #
      # 另一条思路是给每条 gh 命令加 `--repo ${{ github.repository }}`。
      # 选checkout 是因为它一次解决全部 gh 子命令（view/edit/upload），
      # 而 `--repo` 漏写一处就又坏。
      - uses: actions/checkout@v4
      - name: Verify assets then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "Verifying release $TAG"
          # Uploads are done (needs: build jobs); GitHub's asset API can lag
          # minutes before a freshly-uploaded file appears in `gh release view`.
          # Poll up to ~10 min with an initial settle delay before giving up.
          sleep 20
          for i in $(seq 1 30); do
            assets=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)
            ok=1
            for pat in $REQUIRED_ASSETS; do
              printf '%s\n' "$assets" | grep -Eq "$pat" || ok=0
            done
            [ "$ok" -eq 1 ] && break
            echo "  waiting for uploads ($(printf '%s\n' "$assets" | grep -c . || true) so far)..."
            sleep 20
          done
          missing=0
          for pat in $REQUIRED_ASSETS; do
            if ! printf '%s\n' "$assets" | grep -Eq "$pat"; then
              echo "::error::release $TAG missing asset matching $pat"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::release $TAG is missing required assets — left as DRAFT for manual review"
            exit 1
          fi
          echo "All required assets present; publishing $TAG"
          gh release edit "$TAG" --draft=false --latest
